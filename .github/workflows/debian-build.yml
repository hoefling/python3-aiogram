name: Build Debian package

on:
  push:
    branches:
    - main
    tags:
    - '*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:13.3
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DEBIAN_FRONTEND: 'noninteractive'
    steps:
      - name: Install build dependencies
        run: |
          apt update
          apt install -y ca-certificates apt-transport-https curl
          curl -fsSL https://hoefling.io/apt/keys/repo-public.gpg \
            | tee /usr/share/keyrings/hoefling-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hoefling-archive-keyring.gpg] https://hoefling.io/apt stable main" \
            | tee /etc/apt/sources.list.d/hoefling-private.list
          apt update
          apt install -y \
            build-essential \
            debhelper \
            devscripts \
            dh-python \
            git \
            python3-all \
            python3-build \
            python3-hatchling \
            pybuild-plugin-pyproject \
            python3-pytest \
            python3-pytest-aiohttp \
            python3-pytest-asyncio \
            python3-pymongo \
            python3-motor \
            python3-redis \
            python3-aresponses \
            python3-pytz \
            python3-aiohttp-socks \
            python3-babel \
            python3-uvloop \
            python3-aiodns \
            python3-aiofiles \
            python3-pydantic \
            python3-typing-extensions \
            python3-magic-filter

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup non-root user
        run: |
          useradd -m builder
          mkdir -p /home/builder/.cache
          chown -R builder:builder /home/builder
          chown -R builder:builder $GITHUB_WORKSPACE/..
        shell: bash

      - name: Show versions (debug)
        run: |
          python3 --version
          debuild --version

      - name: Build package
        run: |
          su builder -c "
          debuild -us -uc -b
          mkdir artifacts
          cp ../*.deb artifacts/
          cp ../*.changes artifacts/
          cp ../*.buildinfo artifacts/
          "

      - name: Run lintian
        run: |
          su builder -c "
          lintian artifacts/*.changes
          "

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: artifacts/*

  release:
    name: Create GitHub release
    needs: build-deb
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

      - name: Trigger APT repo import
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: import-release.yml
          repo: hoefling/apt
          ref: refs/heads/main
          inputs: '{"repo":"${{ github.repository }}","version":"${{ github.ref_name }}"}'
          token: ${{ secrets.APT_REPO_TOKEN }}
